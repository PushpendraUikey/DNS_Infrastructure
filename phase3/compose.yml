name: dnslab-phase3

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.1.0/24
  resolver_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.2.0/24
  auth_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.3.0/24

services:
  root-ns:
    build: .
    container_name: root-ns
    hostname: root-ns
    environment:
      NODE_ROLE: nameserver
    cap_add: [NET_ADMIN]
    networks:
      auth_net:
        ipv4_address: 172.16.3.10
    volumes:
      - ./root-ns/named.conf:/etc/bind/named.conf:ro
      - ./root-ns/db.root-zone.signed:/etc/bind/db.root-zone.signed:ro
    command: ["named", "-g", "-c", "/etc/bind/named.conf"]

  tld-ns:
    build: .
    container_name: tld-ns
    hostname: tld-ns
    environment:
      NODE_ROLE: nameserver
    cap_add: [NET_ADMIN]
    networks:
      auth_net:
        ipv4_address: 172.16.3.20
    volumes:
      - ./tld-ns/named.conf:/etc/bind/named.conf:ro
      - ./tld-ns/db.com.signed:/etc/bind/db.com.signed:ro
    command: ["named", "-g", "-c", "/etc/bind/named.conf"]

  domain-ns:
    build: .
    container_name: domain-ns
    hostname: domain-ns
    environment:
      NODE_ROLE: nameserver
    cap_add: [NET_ADMIN]
    networks:
      auth_net:
        ipv4_address: 172.16.3.30
    volumes:
      - ./domain-ns/named.conf:/etc/bind/named.conf:ro
      - ./domain-ns/db.example.com.signed:/etc/bind/db.example.com.signed:ro
    command: ["named", "-g", "-c", "/etc/bind/named.conf"]

  core-router:
    build: .
    container_name: core-router
    hostname: core-router
    environment:
      NODE_ROLE: core-router
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      resolver_net:
        ipv4_address: 172.16.2.3
      auth_net:
        ipv4_address: 172.16.3.3
    volumes:
      - ./scripts:/scripts:ro
    command: ["sleep", "infinity"]

  resolver:
    build: .
    container_name: resolver
    hostname: resolver
    environment:
      NODE_ROLE: resolver
    cap_add: [NET_ADMIN]
    networks:
      resolver_net:
        ipv4_address: 172.16.2.10
    volumes:
      - ./resolver/named.conf:/etc/bind/named.conf:ro
      - ./resolver/db.root:/etc/bind/db.root:ro
      - ./resolver/trust-anchor.conf:/etc/bind/trust-anchor.conf:ro
    command: ["named", "-g", "-c", "/etc/bind/named.conf"]
    depends_on: [root-ns, tld-ns, domain-ns, core-router]

  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    container_name: attacker
    hostname: attacker
    environment:
      NODE_ROLE: attacker
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      - net.ipv4.ip_forward=0
    networks:
      resolver_net:
        ipv4_address: 172.16.2.100
    command: ["sleep", "infinity"]
    depends_on: [resolver]

  edge-router:
    build: .
    container_name: edge-router
    hostname: edge-router
    environment:
      NODE_ROLE: edge-router
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      client_net:
        ipv4_address: 172.16.1.2
      resolver_net:
        ipv4_address: 172.16.2.2
    command: ["sleep", "infinity"]

  webserver:
    build: .
    container_name: webserver
    hostname: webserver
    environment:
      NODE_ROLE: webserver
    networks:
      client_net:
        ipv4_address: 172.16.1.20
    volumes:
      - ./web:/srv/web:ro
    command: ["python3", "-m", "http.server", "80", "--directory", "/srv/web"]

  rogue-web:
    build: .
    container_name: rogue-web
    hostname: rogue-web
    environment:
      NODE_ROLE: webserver
    networks:
      client_net:
        ipv4_address: 172.16.1.30
    volumes:
      - ./rogue-web:/srv/web:ro
    command: ["python3", "-m", "http.server", "80", "--directory", "/srv/web"]

  client:
    build: .
    container_name: client
    hostname: client
    environment:
      NODE_ROLE: client
    cap_add: [NET_ADMIN]
    networks:
      client_net:
        ipv4_address: 172.16.1.10
    volumes:
      # so `delv -a` can validate against our root key from the client
      - ./resolver/trust-anchor.conf:/etc/bind/trust-anchor.conf:ro
    command: ["sleep", "infinity"]
    depends_on: [resolver, edge-router, webserver, rogue-web]
