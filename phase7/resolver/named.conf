// TLS material for the encrypted transports.
tls resolver-tls {
    cert-file "/etc/bind/certs/resolver.crt";
    key-file "/etc/bind/certs/resolver.key";
};

// DoH endpoint path.
http resolver-http {
    endpoints { "/dns-query"; };
};

options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation yes;

    listen-on port 53 { any; };                                   // Do53 (cleartext)
    listen-on port 853 tls resolver-tls { any; };                 // DoT
    listen-on port 443 tls resolver-tls http resolver-http { any; }; // DoH
    listen-on-v6 { none; };

    allow-query { any; };
    allow-recursion { any; };
};

// Upstream DNSSEC still holds: our root KSK is the trust anchor.
include "/etc/bind/trust-anchor.conf";

zone "." {
    type hint;
    file "/etc/bind/db.root";
};
