options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation yes;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
};

// The single trust anchor: our root KSK (generated by signer.sh).
include "/etc/bind/trust-anchor.conf";

// Still start from our private root, exactly as in Phase 1.
zone "." {
    type hint;
    file "/etc/bind/db.root";
};
