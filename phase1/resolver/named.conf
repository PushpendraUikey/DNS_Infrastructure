options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
};

// Use our private root instead of the real Internet root servers.
zone "." {
    type hint;
    file "/etc/bind/db.root";
};
